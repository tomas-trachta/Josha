name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bump version
        id: bump
        shell: pwsh
        run: |
          $csprojPath = 'Josha.csproj'
          $issPath = 'installer\Josha.iss'

          $csproj = Get-Content $csprojPath -Raw
          if ($csproj -notmatch '<Version>(\d+)\.(\d+)\.(\d+)</Version>') {
              throw "Could not find <Version> in $csprojPath"
          }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3] + 1
          $newVersion = "$major.$minor.$patch"

          $csproj = $csproj -replace '<Version>\d+\.\d+\.\d+</Version>', "<Version>$newVersion</Version>"
          Set-Content -Path $csprojPath -Value $csproj -NoNewline

          $iss = Get-Content $issPath -Raw
          $iss = $iss -replace '#define MyAppVersion\s+"\d+\.\d+\.\d+"', "#define MyAppVersion     `"$newVersion`""
          Set-Content -Path $issPath -Value $iss -NoNewline

          Write-Host "Bumped version to $newVersion"
          "version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Josha.csproj installer\Josha.iss
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: .\build-installer.ps1

      - name: Create GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.bump.outputs.version }}"
          $installer = Get-ChildItem "installer\Output" -Filter *.exe | Select-Object -First 1
          gh release create "v$version" $installer.FullName `
            --title "Josha $version" `
            --generate-notes
